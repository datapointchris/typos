version: '3'

# Two languages, no shared runner: the Python analyzer in src/ and the Neovim
# plugin in lua/. Every verb here has to reach both, which is the whole reason
# this file exists — `uv run pytest` alone silently covers half the repo.

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent. The
  # virtualenv comes back from uv.lock.
  setup:
    desc: Make a fresh checkout runnable
    cmds:
      - uv sync

  lint:
    desc: Lint both languages and type check the Python
    cmds:
      - task: python:lint
      - task: typecheck
      - task: lua:lint

  python:lint:
    desc: Lint the Python analyzer, formatting included
    cmds:
      - uv run ruff format --check src tests
      - uv run ruff check src tests

  lua:lint:
    desc: Check the Neovim plugin's formatting
    cmds:
      - stylua --check lua

  format:
    desc: Format both languages
    cmds:
      - task: python:format
      - task: lua:format

  python:format:
    desc: Format the Python analyzer
    cmds:
      - uv run ruff format src tests
      - uv run ruff check --fix src tests

  lua:format:
    desc: Format the Neovim plugin
    cmds:
      - stylua lua

  typecheck:
    desc: Type check the Python analyzer
    cmds:
      - uv run mypy src

  test:
    desc: Test both languages
    cmds:
      - task: python:test
      - task: lua:test

  python:test:
    desc: Run the Python test suite
    cmds:
      - uv run pytest

  lua:test:
    desc: Run the Neovim capture tests
    cmds:
      - nvim --headless -u NONE -l tests/capture_spec.lua

  install:
    desc: Install the typos CLI as a uv tool
    cmds:
      - uv tool install --force --editable .
